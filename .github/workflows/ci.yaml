name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint pytest pytest-cov "pytest-homeassistant==2026.11.0"
          pip install requests pycognito boto3 pytz websockets requests-mock python-jose
      - name: Run Pylint
        run: |
          pylint custom_components/mysa
      - name: Run Pytest
        run: |
          pytest
