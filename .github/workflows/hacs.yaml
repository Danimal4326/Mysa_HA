name: HACS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    name: HACS
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
          # Upstream kgelinas/Mysa_HA has no license, and a fork can't add one
          # on the author's behalf. HACS custom repositories work without one.
          ignore: license
